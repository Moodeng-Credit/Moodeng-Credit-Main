<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<base href="/design/bitrepo-journey/">
<link rel="icon" href="/favicon.ico">
<title>Moodeng × BitRepo Journey</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: matches moodeng.app/creditline. Four entry doors fan into one trunk; every box opens its real screens */
:root{
  --bg:#f7f4fb; --card:#ffffff; --ink:#26143f; --sub:#695b7b; --faint:#8a7c9c;
  --border:#e7e0ec; --rule:#f0ecf5; --head:#f8f4fc; --purple:#6b55f7; --purple-deep:#4a35c9;
  --ok:#15803d; --ok-soft:#e8f6ee; --cream:#fffbf3; --cream-edge:#f1e6d3; --carmine:#c8101e;
  --font:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-block:24px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.banner{display:grid;grid-template-columns:1fr minmax(0,300px);align-items:center;gap:8px;background:var(--cream);
  border:2px solid var(--cream-edge);border-radius:28px;padding:28px 12px 0 32px;overflow:hidden;box-shadow:0 5px 0 var(--cream-edge)}
.banner-txt{display:flex;flex-direction:column;gap:10px;padding-bottom:28px;min-width:0}
.banner-art{width:100%;height:auto;align-self:end;display:block}
.lockup{display:flex;align-items:center;gap:10px}
.lockup img{height:44px;width:auto}
.lockup span{font-size:22px;font-weight:800;color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:99px;background:#fff;border:2px solid var(--cream-edge);color:var(--ink)}
.chips span:nth-child(2){border-color:#f3c3c7;color:var(--carmine)}
.eyebrow{font-size:13px;font-weight:700;color:var(--carmine);margin:0;letter-spacing:.02em}
h1{font-size:clamp(28px,4.4vw,40px);font-weight:800;line-height:1.1;margin:0;text-wrap:balance}
.lede{font-size:15px;color:var(--sub);margin:0;max-width:56ch}
.hint{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--sub)}
@media (max-width:700px){.banner{grid-template-columns:1fr;padding:22px 20px 0}.banner-art{max-width:170px;justify-self:center}.banner-txt{padding-bottom:4px}}
.hint b{color:var(--purple)}
.section{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.section-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding:12px 16px;background:var(--head)}
.section-head h2{font-size:16px;font-weight:700;margin:0 auto 0 0}
.section-head span{font-size:12px;font-weight:600;color:var(--faint)}
.section-body{padding:16px}
.label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);margin:0}
/* clickable box */
.box{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:var(--card);
  border:2px solid var(--border);border-radius:16px;padding:14px;min-width:0;position:relative;
  box-shadow:0 3px 0 var(--border);transition:border-color .15s,transform .1s,box-shadow .1s}
.box:hover{border-color:var(--purple)}
.box:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.box:active{transform:translateY(3px);box-shadow:none}
.box h3,.box h4{font-size:16px;font-weight:800;margin:0}
.box .from{font-size:12px;color:var(--sub)}
.box ul{margin:0;padding-left:16px;font-size:13px;color:var(--ink);display:grid;gap:3px}
.box p{margin:0;font-size:13px;color:var(--sub)}
.see{margin-top:auto;padding-top:6px;font-size:12px;font-weight:700;color:var(--purple)}
.box.nopic .see{color:var(--faint)}
.doors{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.doors .box::after{content:"";position:absolute;left:50%;bottom:-27px;width:2px;height:24px;background:var(--border)}
.merge{height:2px;background:var(--border);margin:24px 12.5% 0}
.drop{width:2px;height:22px;background:var(--border);margin:0 auto}
/* trunk */
.trunk{max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.phase{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0}
.phase p{margin:0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--purple);
  background:var(--card);border:1px solid var(--border);border-radius:99px;padding:4px 12px}
.step{flex-direction:row;align-items:flex-start;gap:12px}
.step .n{flex:none;width:56px;height:56px;border-radius:16px;background:var(--head);border:2px solid var(--border);
  display:grid;place-items:center;position:relative}
.step .n img{width:46px;height:46px;object-fit:contain}
.step .n b{position:absolute;right:-7px;bottom:-7px;width:24px;height:24px;border-radius:50%;background:var(--purple);color:#fff;
  font-size:12px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums;border:2px solid #fff}
.box.step:hover .n img{transform:rotate(-8deg) scale(1.08)}
.step .n img{transition:transform .2s}
.step .txt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.step.goal{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 #b9e3c9;cursor:default}
.step.goal .n{background:#fff;border-color:#b9e3c9}
.step.goal .n b{background:var(--ok)}
.tag{align-self:flex-start;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--head);border:1px solid var(--border);color:var(--sub);margin-top:4px}
.note{font-size:12px;color:var(--faint);text-align:center;margin:0}
/* viewer */
dialog{border:none;padding:0;border-radius:24px;width:min(980px,calc(100vw - 24px));max-height:calc(100vh - 24px);
  background:var(--card);color:var(--ink);box-shadow:0 10px 30px rgba(38,20,63,.18);overflow:hidden}
dialog::backdrop{background:rgba(38,20,63,.45)}
.v{display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
.v-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--rule)}
.v-head .t{flex:1;min-width:0}
.v-head h3{margin:0;font-size:20px;font-weight:800}
.v-head p{margin:2px 0 0;font-size:13px;color:var(--sub)}
.x{all:unset;cursor:pointer;width:40px;height:40px;border-radius:12px;border:2px solid var(--border);display:grid;place-items:center;font-size:18px;color:var(--sub);flex:none}
.x:focus-visible{outline:3px solid var(--purple)}
.shots{display:flex;gap:16px;overflow-x:auto;padding:18px;background:var(--bg);flex:1;min-height:0;scroll-snap-type:x mandatory}
.shot{flex:none;margin:0;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start}
.shot img{display:block;height:min(62vh,560px);width:auto;max-width:none;border-radius:14px;border:1px solid var(--border);background:#fff}
.shot.wide img{height:auto;width:min(860px,80vw);max-height:62vh;object-fit:contain}
.shot figcaption{font-size:12px;font-weight:600;color:var(--sub);max-width:300px}
.step.optional{border-style:dashed;background:#fdfbff}
.step.optional .n b{background:#f59e0b}
.lend .n{background:#fff6f6;border-color:#f3c3c7}
.lend .n b{background:var(--carmine)}
.section.lender{border-color:#f3c3c7}
.section.lender .section-head{background:#fff6f6}
.section-head h2 img{height:22px;width:auto;vertical-align:-4px;margin-right:6px}
.mock{flex:none;width:min(380px,80vw);background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;align-self:flex-start}
.mock h5{margin:0;font-size:16px;font-weight:800}
.mock .row{display:flex;justify-content:space-between;gap:12px;font-size:13px;border-top:1px solid var(--rule);padding-top:8px}
.mock .row span:first-child{color:var(--sub)}
.mock .row span:last-child{font-weight:600;text-align:right}
.mock .ok{color:var(--ok)}
.mock blockquote{margin:0;background:var(--head);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5}
.mock small{font-size:11.5px;color:var(--faint)}
.empty{padding:40px 18px;text-align:center;color:var(--faint);font-size:14px;background:var(--bg);flex:1}
.v-foot{display:flex;gap:10px;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--rule)}
.btn{all:unset;cursor:pointer;min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;font-size:14px;display:inline-flex;align-items:center}
.btn.pri{background:var(--purple);color:#fff;box-shadow:0 3px 0 var(--purple-deep)}
.btn.pri:active{transform:translateY(3px);box-shadow:none}
.btn.sec{border:2px solid var(--border);color:var(--ink);background:#fff}
.btn:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.btn[disabled]{opacity:.4;pointer-events:none}
@media (max-width:760px){.doors{grid-template-columns:1fr 1fr}.doors .box::after,.merge{display:none}.doors{margin-bottom:8px}}
@media (max-width:440px){.doors{grid-template-columns:1fr}.shot img{height:min(58vh,480px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

<style>
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#gate form{width:100%;max-width:380px;background:#fff;border-radius:24px;padding:24px;box-shadow:0 10px 30px rgba(38,20,63,.08);display:flex;flex-direction:column;gap:10px;text-align:center}
#gate .gl{display:flex;align-items:center;justify-content:center;gap:10px}
#gate .gl img{height:56px;width:auto}
#gate .gl span{font-size:22px;font-weight:800;color:#8a7c9c}
#gate h1{font-size:22px;margin:6px 0 0}
#gate p{margin:0;font-size:14px;color:#695b7b}
#gate .pw{position:relative;margin-top:8px}
#gate input{box-sizing:border-box;width:100%;min-height:48px;border-radius:16px;border:2px solid #e5ddf0;padding:8px 48px 8px 16px;font-size:16px;font-family:inherit;color:#26143f}
#gate input:focus{outline:none;border-color:#6b55f7}
#gate .eye{all:unset;cursor:pointer;position:absolute;right:4px;top:4px;bottom:4px;width:44px;display:grid;place-items:center;border-radius:12px;color:#8a7c9c;font-size:13px;font-weight:700}
#gate .go{all:unset;cursor:pointer;min-height:52px;border-radius:16px;background:#6b55f7;color:#fff;font-weight:700;box-shadow:0 4px 0 #4a35c9;text-align:center;margin-top:4px}
#gate .go:active{transform:translateY(4px);box-shadow:none}
#gate .go:focus-visible,#gate .eye:focus-visible{outline:3px solid #6b55f7;outline-offset:2px}
#gate .err{color:#dc2626;font-size:13px;font-weight:600;min-height:18px}
</style>

    <p>Borrower and lender journey. Enter the password you were given.</p>
    <div class="pw"><input id="gate-pw" type="password" placeholder="Password" aria-label="Password" autofocus><button type="button" class="eye" id="gate-eye" aria-label="Show password">Show</button></div>
    <div class="err" id="gate-err" role="alert"></div>
    <button class="go" type="submit" id="gate-go">View journey</button>
  </form>
</div>

  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function open(pw) {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(pw.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, key, bytes(CT));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  function show(page) {
    document.getElementById('gate').remove();
    document.body.insertAdjacentHTML('beforeend', page.m);
    const s = document.createElement('script');
    s.textContent = page.s;
    document.body.appendChild(s);
  }
  const form = document.getElementById('gate-form'), input = document.getElementById('gate-pw'), err = document.getElementById('gate-err'), go = document.getElementById('gate-go');
  document.getElementById('gate-eye').onclick = e => { const hidden = input.type === 'password'; input.type = hidden ? 'text' : 'password'; e.currentTarget.textContent = hidden ? 'Hide' : 'Show'; };
  form.addEventListener('submit', async e => {
    e.preventDefault();
    err.textContent = ''; go.textContent = 'Checking…';
    try {
      const page = await open(input.value);
      try { sessionStorage.setItem('bitrepo-journey', input.value); } catch {}
      show(page);
    } catch {
      err.textContent = 'That password is not right. Check it and try again.';
      go.textContent = 'View journey';
    }
  });
  let saved = null;
  try { saved = sessionStorage.getItem('bitrepo-journey'); } catch {}
  if (saved) open(saved).then(show).catch(() => {});
})();
