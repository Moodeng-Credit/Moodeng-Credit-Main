name: Deploy Edge Functions

# Manual only: Actions → "Deploy Edge Functions" → Run workflow, then type the function names.
# Deploys reviewed code from `staging` to the live Supabase project, so nobody needs a local
# `supabase login` (and its 20-token cap) and nothing gets deployed from uncommitted files.
#
# One-time setup: GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_ACCESS_TOKEN = a Supabase personal access token (supabase.com/dashboard/account/tokens)

on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'Function names to deploy, separated by spaces (e.g. "loan-due-notifications fraud-signal-scan")'
        required: true
        type: string

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    # Only ever deploy reviewed code.
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qplmmxynzxzkfxtayoqr
      FUNCTIONS: ${{ inputs.functions }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check the requested functions exist
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repository secret is not set"
            exit 1
          fi
          for fn in $FUNCTIONS; do
            if ! echo "$fn" | grep -Eq '^[a-z0-9-]+$' || [ "$fn" = "_shared" ] || [ ! -f "supabase/functions/$fn/index.ts" ]; then
              echo "::error::'$fn' is not a function in supabase/functions/"
              exit 1
            fi
          done
          echo "Will deploy: $FUNCTIONS"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        # Reads verify_jwt per function from supabase/config.toml and bundles _shared imports.
        run: |
          for fn in $FUNCTIONS; do
            echo "::group::Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done
