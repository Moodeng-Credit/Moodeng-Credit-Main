<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <link rel="icon" type="image/png" href="/brand/moodeng-logo.png" />
      <link rel="apple-touch-icon" href="/brand/moodeng-logo.png" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="color-scheme" content="light dark" />
      <!-- Facebook domain verification (Meta Business). Must stay in the static <head>, not JS-injected. -->
      <meta name="facebook-domain-verification" content="8vecwzux9hnlf7ae8kziso1niwq64l" />
      <script>
         // Apply the saved theme before first paint so dark-mode users don't see a
         // flash of light-mode styles while src/main.tsx loads. Key must match
         // THEME_MODE_STORAGE_KEY in src/lib/themeMode.ts.
         (function () {
            try {
               if (localStorage.getItem('moodeng-theme-mode') === 'dark') {
                  document.documentElement.classList.add('dark');
                  document.documentElement.dataset.theme = 'dark';
                  document.documentElement.style.colorScheme = 'dark';
               }
            } catch (e) {}
         })();
      </script>
      <title>Moodeng Credit — Build credit with small USDC loans</title>
      <meta
         name="description"
         content="Moodeng Credit lets you borrow small USDC loans, verify with World ID, and build a portable Trust Score and Credit Level — no traditional credit history needed."
      />
      <link rel="canonical" href="https://moodeng.app/" />
      <meta name="robots" content="index, follow" />

      <!-- Open Graph / social -->
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="Moodeng Credit" />
      <meta property="og:title" content="Moodeng Credit — Build credit with small USDC loans" />
      <meta
         property="og:description"
         content="Borrow small USDC loans, verify with World ID, and build a portable Trust Score and Credit Level — no traditional credit history needed."
      />
      <meta property="og:url" content="https://moodeng.app/" />
      <meta property="og:image" content="https://moodeng.app/brand/moodeng-logo.png" />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="Moodeng Credit — Build credit with small USDC loans" />
      <meta
         name="twitter:description"
         content="Borrow small USDC loans, verify with World ID, and build a portable Trust Score and Credit Level."
      />
      <meta name="twitter:image" content="https://moodeng.app/brand/moodeng-logo.png" />

      <script type="application/ld+json">
         {
            "@context": "https://schema.org",
            "@type": "Organization",
            "name": "Moodeng Credit",
            "url": "https://moodeng.app/",
            "logo": "https://moodeng.app/brand/moodeng-logo.png",
            "description": "A community lending platform for small USDC loans with World ID verification and a portable Trust Score."
         }
      </script>

      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
      <!-- Warm the connection to Telegram's login widget origins during page load so the
           "Loading Telegram…" button on sign-in/sign-up doesn't wait on a cold DNS+TLS
           handshake when TelegramAuthButton injects the widget script. -->
      <link rel="preconnect" href="https://telegram.org" />
      <link rel="preconnect" href="https://oauth.telegram.org" />
      <link rel="dns-prefetch" href="https://telegram.org" />
      <link rel="dns-prefetch" href="https://oauth.telegram.org" />
   </head>
   <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
   </body>
</html>
