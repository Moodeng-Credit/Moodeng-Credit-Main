<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <link rel="icon" type="image/svg+xml" href="/vite.svg" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="color-scheme" content="light dark" />
      <script>
         // Apply the saved theme before first paint so dark-mode users don't see a
         // flash of light-mode styles while src/main.tsx loads. Key must match
         // THEME_MODE_STORAGE_KEY in src/lib/themeMode.ts.
         (function () {
            try {
               if (localStorage.getItem('moodeng-theme-mode') === 'dark') {
                  document.documentElement.classList.add('dark');
                  document.documentElement.dataset.theme = 'dark';
                  document.documentElement.style.colorScheme = 'dark';
               }
            } catch (e) {}
         })();
      </script>
      <title>Moodeng - Decentralized Microfinance Platform</title>
      <meta name="description" content="A decentralized microfinance platform built on Web3 technology" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
      <!-- Warm the connection to Telegram's login widget origins during page load so the
           "Loading Telegram…" button on sign-in/sign-up doesn't wait on a cold DNS+TLS
           handshake when TelegramAuthButton injects the widget script. -->
      <link rel="preconnect" href="https://telegram.org" />
      <link rel="preconnect" href="https://oauth.telegram.org" />
      <link rel="dns-prefetch" href="https://telegram.org" />
      <link rel="dns-prefetch" href="https://oauth.telegram.org" />
   </head>
   <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
   </body>
</html>
